# Everything that has to be true before a change lands.
#
# The engine runs first and on its own. It is pure Kotlin, it takes a couple of seconds, and
# it holds the solver and the rating, so a break there should be reported in a minute rather
# than after a ten minute Android build.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Half past three in the morning UTC. The device tests run here rather than on every push,
    # see the note on the job itself.
    - cron: '30 3 * * *'

concurrency:
  # A newer push makes an older run pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # Caches the Gradle distribution, the dependency cache and the configuration cache,
        # and writes them back only from the default branch so a pull request cannot poison
        # the cache for everybody else.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Formatting and code smells
        # Both are fast and both fail the build, so a review never has to be about braces.
        run: ./gradlew spotlessCheck detekt --stacktrace

      - name: Test the engine
        run: ./gradlew :engine:check --stacktrace

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        # Warnings are errors here, so this fails on a hardcoded string or a missing
        # translation rather than filing it in a report nobody opens.
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build the release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the release artefact
        # Size, and the 16 KB page alignment of the native libraries that arrive with
        # AndroidX. Neither is something a compiler warning would catch, and both are a
        # dependency bump away from breaking.
        run: ./tools/check-release.sh

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            app/build/reports
            app/build/outputs/apk/release
          if-no-files-found: ignore

  instrumented:
    name: On a device
    runs-on: ubuntu-latest
    #
    # Not on push, on purpose.
    #
    # An emulator on a shared runner is the least reliable thing in this build by a wide
    # margin, and a check that is red for reasons of its own teaches everybody to ignore the
    # colour. That is worse than not having the check: a real failure then goes unread too.
    #
    # So it runs nightly and on demand, where a flake costs nothing and a real break is still
    # found within a day. The tests themselves have to pass before anything is pushed, which
    # is a person running ./gradlew :app:connectedDebugAndroidTest, and that is enforced by
    # habit rather than by a gate. Move it back onto push once it has been green for a week.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Allow hardware acceleration
        # The rule has to be written, not just reloaded. Reloading rules that do not exist
        # leaves /dev/kvm readable only by the kvm group, the emulator quietly falls back to
        # software emulation, and it is then slow enough that adb reports the device offline
        # before it finishes booting. That is what was failing here on every push.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0
          ls -l /dev/kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Pinned to match the API level the screenshot reference images were captured on.
          # A different one renders text differently enough to fail the comparison.
          api-level: 36
          target: google_apis
          arch: x86_64
          # A device profile, because without one the emulator comes up on a 320 by 640 screen,
          # smaller than any phone sold this century. The screenshot scene is 720 by 800 and was
          # being clipped to the window, which is why every reference image "differed in one
          # hundred percent of its pixels" here while passing on a real profile locally.
          profile: pixel_6
          disable-animations: true
          # No window, no audio, no camera, and the software renderer that actually works
          # headless. Left to its own devices the emulator tries for a GPU that is not there.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none
            -gpu swiftshader_indirect -memory 4096
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Keep the device test report
        # Without this a failure on a device is only readable by scrolling a log, which is how
        # this job stayed red for a day without anybody reading it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
