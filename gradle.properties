org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# R8 in full mode. It is the default from AGP 8, but the default is a thing that can change
# under you, and a release build that silently stops optimising is not something you notice
# until the APK is twice the size. Stated here so it is a decision, not an accident.
android.enableR8.fullMode=true
